name: Bug report
description: Something isn't working — no mic, a broken window or tray icon, a file that won't clean, a crash, or bad audio.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A few details make the fix
        much faster. Please skim the [open issues](https://github.com/Fovty/hushmic/issues)
        first in case it's already known, and the
        [troubleshooting guide](https://github.com/Fovty/hushmic/blob/main/docs/troubleshooting.md)
        for the common ones.
  - type: input
    id: version
    attributes:
      label: HushMic version
      description: First line of `hushmic --version`.
      placeholder: "hushmic 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Install script (curl … | sudo sh)
        - .deb package
        - AUR (hushmic-bin or hushmic)
        - Fedora COPR
        - NixOS flake
        - AppImage
        - Flatpak (built from the manifest)
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution & version
      placeholder: "Ubuntu 24.04 / Bazzite 41 / Arch / Debian 12 …"
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop environment
      description: >
        And X11 or Wayland, if you know. For a missing tray icon: GNOME needs
        the "AppIndicator and KStatusNotifierItem Support" extension.
      placeholder: "KDE Plasma 6 (Wayland) / GNOME 48 + AppIndicator / Cinnamon / Sway …"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: >
        Run `hushmic --doctor`, or click **Copy diagnostics** in
        Settings › About, and paste the output — it answers most environment
        questions in one go and includes the recent filter-chain log. It's
        plain text: versions, paths, and device names, nothing sensitive.
      render: shell
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: >
        Quit HushMic, run `hushmic` from a terminal and paste anything it
        prints (as a service: `journalctl --user -u hushmic -b`). For a file
        that won't clean or save, its format helps (`ffprobe FILE`, or just
        the file type and where it came from).
      render: shell
